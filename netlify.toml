# Netlify Configuration for Earth Jukebox
[build]
  command = "npm run build"
  publish = "dist"

# Single-page application redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-control headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
